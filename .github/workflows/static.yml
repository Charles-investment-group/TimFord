# Deploy to GitHub Pages — fixed: use setup-node + npm (no pnpm), add debug info
on:
  push:
    branches:
      - main

name: Deploy to GitHub Pages

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (use project's Node)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: CI environment info (debug)
        run: |
          echo "== Environment =="
          node -v
          npm -v || true
          echo "== Workspace listing =="
          pwd
          ls -la
          echo "== cig directory listing =="
          ls -la cig || true
          echo "== Lockfile checks =="
          if [ -f cig/pnpm-lock.yaml ]; then echo "pnpm lock exists"; else echo "no pnpm lock"; fi
          if [ -f cig/package-lock.json ]; then echo "npm lock exists"; else echo "no npm lock"; fi

      - name: Install dependencies
        working-directory: cig
        run: |
          # Use npm (project has cig/package-lock.json). Prefer CI mode for reproducible installs.
          npm ci --prefer-offline --no-audit

      - name: Build
        working-directory: cig
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'cig/dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
