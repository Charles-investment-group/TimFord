name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Optional debug step to confirm file layout
      - name: Dump workspace (debug)
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -name package.json || true

      - name: Install dependencies
        working-directory: cig
        run: npm ci

      - name: build
        working-directory: cig
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # adjust to the actual output folder your build creates:
          # use 'cig/dist/' if vite default, or 'cig/build/' if your adapter outputs 'build/'
          path: 'cig/dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
