# Deploy to GitHub Pages — updated for Svelte project at repo root (no cig/)
on:
  push:
    branches:
      - main

name: Deploy to GitHub Pages

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (use project's Node)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: CI environment info (debug)
        run: |
          echo "== Environment =="
          node -v
          npm -v || true
          echo "== Workspace listing =="
          pwd
          ls -la
          echo "== Lockfile checks =="
          if [ -f package-lock.json ]; then echo "npm lock exists"; else echo "no npm lock"; fi
          if [ -f pnpm-lock.yaml ]; then echo "pnpm lock exists"; else echo "no pnpm lock"; fi

      - name: Install dependencies
        run: |
          echo "Installing dependencies at repository root"
          npm ci --prefer-offline --no-audit

      - name: Build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "Running build at repository root"
          npm run build

      - name: Prepare artifact for upload
        run: |
          # Create a consistent site/ folder so upload step has a single known source
          rm -rf site
          mkdir -p site
          echo "Looking for common build output directories"
          candidates=("build" "dist" "public" "public/build" "build/client" "out" "static")
          found=false
          for c in "${candidates[@]}"; do
            if [ -d "$c" ]; then
              # Prefer directories that look like static sites (contain index.html)
              if [ -f "$c/index.html" ] || [ -f "$c/index.htm" ] || ls "$c" | grep -q -E 'index\.html|index\.htm' 2>/dev/null; then
                echo "Using $c as artifact source"
                cp -a "$c" site
                found=true
                break
              fi
            fi
          done
          # Fallback: copy first existing candidate if none contain index.html
          if [ "$found" = false ]; then
            for c in "${candidates[@]}"; do
              if [ -d "$c" ]; then
                echo "No index.html detected; falling back to $c"
                cp -a "$c" site
                found=true
                break
              fi
            done
          fi
          if [ "$found" = false ]; then
            echo "No build output found in common locations (build, dist, public, out, static). Listing workspace:"
            ls -la
            exit 1
          fi
          echo "site/ contents:"
          ls -la site || true

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
