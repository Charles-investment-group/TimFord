name: Run Node.js on GitHub Server

# Triggers whenever you push changes to the main branch or click the manual button
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  run-node-app:
    runs-on: ubuntu-latest

    steps:
      - name: Copy code to the cloud server
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Uses the stable Node 20 LTS environment
          cache: 'npm'       # Speeds up future runs by caching npm packages

      # Fix: Added --ignore-scripts to prevent SvelteKit from firing before it is ready
      - name: Install node_modules dependencies
        run: npm install --ignore-scripts         # A clean, faster version of 'npm install' for servers

      - name: Execute Node code
        run: npm start       # Runs the start script defined in your package.json
        
    # Manually run the sync and build after dependencies are installed safely
      - name: Sync and Build SvelteKit Project
        run: |
          npx svelte-kit sync
          npm run build --if-present

      - name: Execute Node code
        timeout-minutes: 1 # Automatically shuts down after 1 minute of running successfully
        run: npm start


        
