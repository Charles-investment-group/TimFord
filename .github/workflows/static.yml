name: Run Node.js on GitHub Server

# Triggers whenever you push changes to the main branch or click the manual button
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  run-node-app:
    runs-on: ubuntu-latest

    steps:
      - name: Copy code to the cloud server
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Uses the stable Node 20 LTS environment
          cache: 'npm'       # Speeds up future runs by caching npm packages

      - name: Install node_modules dependencies
        run: npm ci          # A clean, faster version of 'npm install' for servers

      - name: Execute Node code
        run: npm start       # Runs the start script defined in your package.json
